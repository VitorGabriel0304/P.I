<!doctype html>
<html lang="pt-br">
  <head>
    <!-- Configurações básicas de caracteres e título -->
    <meta charset="UTF-8" />
    <title>Login - BiblioCommunity</title>
    <!-- CSS do Bootstrap para o layout -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Estilo personalizado (como o fundo em degradê) -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body class="auth-wrapper">
    <!-- Caixa centralizada para o formulário de login -->
    <div class="auth-card">
      <h3 class="text-center mb-4">📚 BiblioCommunity</h3>
      <!-- Exibe mensagens de erro caso o login falhe -->
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div class="alert alert-{{ category }} small">{{ message }}</div>
      {% endfor %} {% endif %} {% endwith %}
      <!-- Formulário que envia os dados para validação no servidor -->
      <form method="POST">
        <!-- Campo para digitar o e-mail -->
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input
            type="email"
            name="email"
            class="form-control"
            placeholder="E-mail do usuário"
            required
          />
        </div>
        <!-- Campo para digitar a senha -->
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input
            type="password"
            name="senha"
            class="form-control"
            placeholder="Senha do usuário"
            required
          />
        </div>
        <!-- Botão para enviar os dados de login -->
        <button type="submit" class="btn btn-primary w-100">
          Entrar no Sistema
        </button>
      </form>
      <!-- Link para retornar à página inicial pública -->
      <div class="mt-3 text-center">
        <a href="{{ url_for('index') }}" class="text-muted small"
          >Voltar para Início</a
        >
      </div>
    </div>
  </body>
</html>
